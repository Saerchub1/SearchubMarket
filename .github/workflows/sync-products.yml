name: Searchub Product Synchronization

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: searchub-product-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Download website repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so git history gives real lastmod dates

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Synchronize Google Sheet products
        run: python scripts/sync_products.py

      - name: Generate sitemap
        run: python scripts/generate_sitemap.py

      - name: Save website changes
        run: |
          git config user.name "Searchub Automation"
          git config user.email "actions@users.noreply.github.com"

          git add products/ sitemap.xml

          if ! git diff --cached --quiet; then
            git commit -m "Automatically synchronize Searchub products and sitemap"
            git push
          else
            echo "No product or sitemap changes detected."
          fi
